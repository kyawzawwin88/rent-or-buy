sonar.projectKey=rent-or-buy
sonar.projectName=Rent or Buy
sonar.host.url=${env.SONAR_HOST_URL}

sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.cache/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Auth and host: set SONAR_TOKEN and SONAR_HOST_URL in the repo root `.env`.
# Run from the repo root: pnpm sonar
#
# Quality gate must pass for every deliverable (see AGENTS.md).
